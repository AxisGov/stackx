<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="As cinco etapas do stackx e o artefato de cada uma">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a371f7"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d29922"/></marker>
  </defs>
  <rect width="1000" height="440" rx="12" fill="#0d1117"/>
  <text x="36" y="40" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">As cinco etapas</text>
  <text x="36" y="62" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#8b949e">Convencao nao se propoe, se descobre. Toda regra aponta um arquivo real do repositorio.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="36"  y="92" width="168" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="36"  y="92" width="168" height="4" rx="2" fill="#a371f7"/>
    <text x="50" y="121" font-size="13.5" font-weight="700" fill="#e6edf3">1 DETECCAO</text>
    <text x="50" y="145" font-size="10" fill="#8b949e">le manifestos, testes,</text>
    <text x="50" y="161" font-size="10" fill="#8b949e">migracoes, CI e codigo</text>
    <text x="50" y="177" font-size="10" fill="#8b949e">em 8 fontes, nessa ordem</text>
    <text x="50" y="203" font-size="9.5" fill="#a371f7">inventario + evidencia</text>

    <rect x="226" y="92" width="168" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="226" y="92" width="168" height="4" rx="2" fill="#a371f7"/>
    <text x="240" y="121" font-size="13.5" font-weight="700" fill="#e6edf3">2 CONVENCOES</text>
    <text x="240" y="145" font-size="10" fill="#8b949e">seis secoes, cada uma</text>
    <text x="240" y="161" font-size="10" fill="#8b949e">com arquivo e linha que</text>
    <text x="240" y="177" font-size="10" fill="#8b949e">sustentam a regra</text>
    <text x="240" y="203" font-size="9.5" fill="#a371f7">CONVENCOES.md</text>

    <rect x="416" y="92" width="168" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="416" y="92" width="168" height="4" rx="2" fill="#d29922"/>
    <text x="430" y="121" font-size="13.5" font-weight="700" fill="#e6edf3">3 CONFLITO</text>
    <text x="430" y="145" font-size="10" fill="#8b949e">dois dialetos? apresenta</text>
    <text x="430" y="161" font-size="10" fill="#8b949e">contagem e datas e</text>
    <text x="430" y="177" font-size="10" fill="#8b949e">PERGUNTA. Nao escolhe.</text>
    <text x="430" y="203" font-size="9.5" fill="#d29922">LACUNAS.md · PROPOSTA</text>

    <rect x="606" y="92" width="168" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="606" y="92" width="168" height="4" rx="2" fill="#3fb950"/>
    <text x="620" y="121" font-size="13.5" font-weight="700" fill="#e6edf3">4 ADERENCIA</text>
    <text x="620" y="145" font-size="10" fill="#8b949e">confere o diff contra</text>
    <text x="620" y="161" font-size="10" fill="#8b949e">as convencoes; aponta,</text>
    <text x="620" y="177" font-size="10" fill="#8b949e">nunca corrige</text>
    <text x="620" y="203" font-size="9.5" fill="#3fb950">tabela de severidade</text>

    <rect x="796" y="92" width="168" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="796" y="92" width="168" height="4" rx="2" fill="#3fb950"/>
    <text x="810" y="121" font-size="13.5" font-weight="700" fill="#e6edf3">5 ATUALIZACAO</text>
    <text x="810" y="145" font-size="10" fill="#8b949e">redetecta do zero e</text>
    <text x="810" y="161" font-size="10" fill="#8b949e">mostra o diff; nunca</text>
    <text x="810" y="177" font-size="10" fill="#8b949e">sobrescreve em silencio</text>
    <text x="810" y="203" font-size="9.5" fill="#3fb950">diff + confirmacao</text>
  </g>

  <g stroke="#a371f7" stroke-width="2" fill="none">
    <path d="M206 158h12" marker-end="url(#a)"/>
    <path d="M396 158h12" marker-end="url(#a)"/>
    <path d="M586 158h12" marker-end="url(#a)"/>
    <path d="M776 158h12" marker-end="url(#a)"/>
  </g>

  <g stroke="#d29922" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <path d="M500 224v40H310v-36" marker-end="url(#r)"/>
  </g>
  <text x="516" y="282" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#d29922">conflito resolvido pelo usuario: volta e grava a decisao</text>

  <g stroke="#d29922" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <path d="M880 224v84H120v-80" marker-end="url(#r)"/>
  </g>
  <text x="500" y="326" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#d29922">o projeto mudou de runner, ORM ou estrutura: redetecta do zero</text>

  <rect x="36" y="352" width="928" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="378" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#e6edf3">Convencao sem evidencia no codigo nao e convencao: e PROPOSTA, e PROPOSTA nao governa —</text>
  <text x="56" y="398" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#e6edf3">nas skills irmas ela vira decisao a levantar, nunca regra a obedecer.</text>
</svg>
