<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="As cinco etapas do stackx e o artefato de cada uma">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8250df"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a6700"/></marker>
  </defs>
  <rect width="1000" height="440" rx="12" fill="#ffffff"/>
  <text x="36" y="40" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#1f2328">As cinco etapas</text>
  <text x="36" y="62" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#59636e">Convencao nao se propoe, se descobre. Toda regra aponta um arquivo real do repositorio.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="36"  y="92" width="168" height="132" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <rect x="36"  y="92" width="168" height="4" rx="2" fill="#8250df"/>
    <text x="50" y="121" font-size="13.5" font-weight="700" fill="#1f2328">1 DETECCAO</text>
    <text x="50" y="145" font-size="10" fill="#59636e">le manifestos, testes,</text>
    <text x="50" y="161" font-size="10" fill="#59636e">migracoes, CI e codigo</text>
    <text x="50" y="177" font-size="10" fill="#59636e">em 8 fontes, nessa ordem</text>
    <text x="50" y="203" font-size="9.5" fill="#8250df">inventario + evidencia</text>

    <rect x="226" y="92" width="168" height="132" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <rect x="226" y="92" width="168" height="4" rx="2" fill="#8250df"/>
    <text x="240" y="121" font-size="13.5" font-weight="700" fill="#1f2328">2 CONVENCOES</text>
    <text x="240" y="145" font-size="10" fill="#59636e">seis secoes, cada uma</text>
    <text x="240" y="161" font-size="10" fill="#59636e">com arquivo e linha que</text>
    <text x="240" y="177" font-size="10" fill="#59636e">sustentam a regra</text>
    <text x="240" y="203" font-size="9.5" fill="#8250df">CONVENCOES.md</text>

    <rect x="416" y="92" width="168" height="132" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <rect x="416" y="92" width="168" height="4" rx="2" fill="#9a6700"/>
    <text x="430" y="121" font-size="13.5" font-weight="700" fill="#1f2328">3 CONFLITO</text>
    <text x="430" y="145" font-size="10" fill="#59636e">dois dialetos? apresenta</text>
    <text x="430" y="161" font-size="10" fill="#59636e">contagem e datas e</text>
    <text x="430" y="177" font-size="10" fill="#59636e">PERGUNTA. Nao escolhe.</text>
    <text x="430" y="203" font-size="9.5" fill="#9a6700">LACUNAS.md · PROPOSTA</text>

    <rect x="606" y="92" width="168" height="132" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <rect x="606" y="92" width="168" height="4" rx="2" fill="#1a7f37"/>
    <text x="620" y="121" font-size="13.5" font-weight="700" fill="#1f2328">4 ADERENCIA</text>
    <text x="620" y="145" font-size="10" fill="#59636e">confere o diff contra</text>
    <text x="620" y="161" font-size="10" fill="#59636e">as convencoes; aponta,</text>
    <text x="620" y="177" font-size="10" fill="#59636e">nunca corrige</text>
    <text x="620" y="203" font-size="9.5" fill="#1a7f37">tabela de severidade</text>

    <rect x="796" y="92" width="168" height="132" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <rect x="796" y="92" width="168" height="4" rx="2" fill="#1a7f37"/>
    <text x="810" y="121" font-size="13.5" font-weight="700" fill="#1f2328">5 ATUALIZACAO</text>
    <text x="810" y="145" font-size="10" fill="#59636e">redetecta do zero e</text>
    <text x="810" y="161" font-size="10" fill="#59636e">mostra o diff; nunca</text>
    <text x="810" y="177" font-size="10" fill="#59636e">sobrescreve em silencio</text>
    <text x="810" y="203" font-size="9.5" fill="#1a7f37">diff + confirmacao</text>
  </g>

  <g stroke="#8250df" stroke-width="2" fill="none">
    <path d="M206 158h12" marker-end="url(#a)"/>
    <path d="M396 158h12" marker-end="url(#a)"/>
    <path d="M586 158h12" marker-end="url(#a)"/>
    <path d="M776 158h12" marker-end="url(#a)"/>
  </g>

  <g stroke="#9a6700" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <path d="M500 224v40H310v-36" marker-end="url(#r)"/>
  </g>
  <text x="516" y="282" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#9a6700">conflito resolvido pelo usuario: volta e grava a decisao</text>

  <g stroke="#9a6700" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <path d="M880 224v84H120v-80" marker-end="url(#r)"/>
  </g>
  <text x="500" y="326" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#9a6700">o projeto mudou de runner, ORM ou estrutura: redetecta do zero</text>

  <rect x="36" y="352" width="928" height="60" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="56" y="378" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1f2328">Convencao sem evidencia no codigo nao e convencao: e PROPOSTA, e PROPOSTA nao governa —</text>
  <text x="56" y="398" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#1f2328">nas skills irmas ela vira decisao a levantar, nunca regra a obedecer.</text>
</svg>
