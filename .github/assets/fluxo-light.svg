<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="O stackx le manifestos, testes, migracoes e codigo do repositorio e gera o CONVENCOES.md, que sprintx, runx e legadox consultam antes de escrever codigo; diante de dois dialetos em conflito, pergunta ao humano">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8250df"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9a6700"/></marker>
  </defs>
  <rect width="1000" height="400" rx="12" fill="#ffffff"/>
  <text x="36" y="40" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="700" fill="#1f2328">Do repositorio ao codigo novo</text>
  <text x="36" y="62" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#59636e">O que o repositorio ja faz e convencao. O que ele nao faz ainda e proposta.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="36" y="92" width="176" height="180" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <rect x="36" y="92" width="176" height="4" rx="2" fill="#59636e"/>
    <text x="50" y="121" font-size="13.5" font-weight="700" fill="#1f2328">REPOSITORIO</text>
    <text x="50" y="147" font-size="10.5" fill="#59636e">manifestos e locks</text>
    <text x="50" y="167" font-size="10.5" fill="#59636e">testes que ja existem</text>
    <text x="50" y="187" font-size="10.5" fill="#59636e">migracoes e schema</text>
    <text x="50" y="207" font-size="10.5" fill="#59636e">integracao continua</text>
    <text x="50" y="227" font-size="10.5" fill="#59636e">pastas, imports, camadas</text>
    <text x="50" y="253" font-size="9.5" fill="#8250df">evidencia real</text>

    <rect x="286" y="92" width="176" height="180" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
    <rect x="286" y="92" width="176" height="4" rx="2" fill="#8250df"/>
    <text x="300" y="121" font-size="13.5" font-weight="700" fill="#1f2328">stackx</text>
    <text x="300" y="141" font-size="10" fill="#59636e">detector e gerador</text>
    <text x="300" y="171" font-size="10.5" fill="#1f2328">1 deteccao</text>
    <text x="300" y="191" font-size="10.5" fill="#1f2328">2 convencoes</text>
    <text x="300" y="211" font-size="10.5" fill="#1f2328">3 conflito e lacuna</text>
    <text x="300" y="231" font-size="10.5" fill="#1f2328">4 aderencia</text>
    <text x="300" y="251" font-size="10.5" fill="#1f2328">5 atualizacao</text>

    <rect x="536" y="92" width="176" height="180" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <rect x="536" y="92" width="176" height="4" rx="2" fill="#1a7f37"/>
    <text x="550" y="121" font-size="12.5" font-weight="700" fill="#1f2328">CONVENCOES.md</text>
    <text x="550" y="147" font-size="10.5" fill="#59636e">onde o teste mora</text>
    <text x="550" y="167" font-size="10.5" fill="#59636e">como o banco e isolado</text>
    <text x="550" y="187" font-size="10.5" fill="#59636e">comandos que rodam</text>
    <text x="550" y="207" font-size="10.5" fill="#59636e">camadas e dependencias</text>
    <text x="550" y="227" font-size="10.5" fill="#59636e">como se sinaliza erro</text>
    <text x="550" y="253" font-size="9.5" fill="#1a7f37">toda regra com evidencia</text>

    <rect x="786" y="92" width="178" height="52" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="875" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">sprintx</text>
    <rect x="786" y="156" width="178" height="52" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="875" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">runx</text>
    <rect x="786" y="220" width="178" height="52" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="875" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">legadox</text>
  </g>

  <g stroke="#8250df" stroke-width="2" fill="none">
    <path d="M214 182h58" marker-end="url(#a)"/>
    <path d="M464 182h58" marker-end="url(#a)"/>
    <path d="M714 182h58" marker-end="url(#a)"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#59636e" text-anchor="middle">
    <text x="243" y="175">le</text>
    <text x="493" y="175">gera</text>
    <text x="743" y="175">obedecem</text>
  </g>

  <g stroke="#9a6700" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <path d="M374 272v34" marker-end="url(#r)"/>
  </g>
  <rect x="222" y="312" width="304" height="52" rx="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="1.8"/>
  <text x="374" y="334" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#1f2328">dois dialetos em conflito</text>
  <text x="374" y="352" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#9a6700">pergunta ao humano, nao escolhe sozinho</text>

  <text x="786" y="304" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#59636e">Em projeto legado, na area tocada</text>
  <text x="786" y="322" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#59636e">manda o PERFIL.md: o stackx governa</text>
  <text x="786" y="340" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#59636e">so codigo novo, em arquivo novo.</text>
</svg>
